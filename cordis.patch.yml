# ============================================================================
# 视频理解插件 —— DSH bundle patch
# ============================================================================
# 这个文件只有一件事：把插件挂进 profile 的 bundle 列表。
#
# 装法（本地 link，源码就在原地，改完重启即生效）：
#   dsh plugin --profile desktop add "link:<本仓库绝对路径>"
#
# 也可以手改 profile 的 package.json：
#   dependencies 里加一条本仓库的 link 依赖，再加进 dsh.profile.bundles
#   （字段名照 README「安装 / 方式二」抄）。改完同样要重启。
#
# ⚠️ 坑：下面这个 id 在整份 profile 的 patch 链里只能出现一次。
#    重复 insert 会让宿主的挂载计划里出现两个同名实例，启动直接崩——
#    而且报错不会指向本文件，排查成本很高。
#    手改过 profile、又跑过一次 dsh plugin add 的，先把重复的那条删掉。
# ============================================================================

- insert:
    - id: dsh-video
      name: dsh-video
